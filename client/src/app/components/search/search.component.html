<h1>Search Spotify</h1>

<input [(ngModel)]="searchString">

<select [(ngModel)]="searchCategory" (ngModelChange)="resources = []">
	<option *ngFor="let category of searchCategories" [value]="category">
		{{ category }}
	</option>
</select>

<button class="btn btn-light" (click)="search()">
	Search
</button>

@if (searchCategory === 'track') {
<app-track-list [tracks]="tracks"></app-track-list>
} @else {
<app-carousel [resources]="resources" carouselId="searchCarousel">
</app-carousel>
}
